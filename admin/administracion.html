<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestión de Movimientos · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Cuadrícula de 3 columnas para los campos del formulario */
        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            align-items: start;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }

        /* Empuja el bloque de botones de gestión completamente a la derecha */
        .btn-gest-cuotas {
            margin-left: auto;
        }

        .btn-gest-socios {
            margin-left: 0.5rem; /* Pequeña separación entre Gest.Socios y Gest.Cuotas */
        }

        @media (max-width: 600px) {
            .btn-gest-cuotas,
            .btn-gest-socios {
                margin-left: 0;
            }
        }

        /* Indicador visual de campo solo lectura */
        input[readonly] {
            background-color: var(--color-bg-disabled, #f0f0f0);
            cursor: not-allowed;
        }

        /* Visibilidad y contraste del campo de fecha automática */
        #fecha_apunte[readonly],
        #saldo[readonly] {
            color: #ffffff !important;
            opacity: 1 !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
            cursor: default;
        }

        /* Ocultar las flechas de los campos numéricos (Chrome, Safari, Edge, Opera) */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Ocultar las flechas en Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        @media (max-width: 900px) {
            .form-grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .form-grid-3 {
                grid-template-columns: 1fr;
            }
            
            /* En pantallas muy estrechas permitimos que el botón baje si es necesario */
            .form-actions {
                flex-wrap: wrap;
            }
            .btn-gest-cuotas {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="../index.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links></div>
        </nav>
    </header>

    <main class="container">

        <section class="page-hero">
            <p class="eyebrow">Administración</p>
            <h1>Gestión de Movimientos</h1>
            <p class="lead">Alta y registro de apuntes contables para el <strong>club</strong>.</p>
        </section>

        <section class="app-layout-single">
            <div class="content-grid">

                <article class="card wide">
                    <h3>Nuevo Movimiento Contable</h3>

                    <form class="form form-grid-3" id="formMovimiento">

                        <!-- FILA 1 -->
                        <div class="form-group">
                            <label for="temporada">Temporada *</label>
                            <input class="input" id="temporada" required placeholder="2025/2026">
                        </div>

                        <div class="form-group">
                            <label for="fecha_contable">Fecha contable *</label>
                            <input class="input" type="date" id="fecha_contable" required>
                        </div>

                        <div class="form-group">
                            <label for="fecha_apunte">Fecha apunte</label>
                            <input class="input" type="text" id="fecha_apunte" placeholder="dd-mm-aaaa" readonly>
                        </div>

                        <!-- FILA 2 -->
                        <div class="form-group">
                            <label for="concepto">Concepto *</label>
                            <input class="input" id="concepto" required placeholder="Cobro de cuota">
                        </div>

                        <div class="form-group">
                            <label for="tipo">Tipo de gasto</label>
                            <select class="input" id="tipo">
                                <option value="">-- Seleccionar --</option>
                                <option value="Arbitraje">Arbitraje</option>
                                <option value="Otros">Otros</option>
                                <option value="Invitacion_visitante">Invitacion_visitante</option>
                                <option value="Invitacion_local">Invitacion_local</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="codigo_cuenta">Código de cuenta (Socio) *</label>
                            <select class="input" id="codigo_cuenta" required>
                                <option value="">Cargando socios...</option>
                            </select>
                        </div>

                        <!-- FILA 3 -->
                        <div class="form-group">
                            <label for="importe">Importe (€) *</label>
                            <input class="input" type="number" step="0.01" id="importe" required placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="saldo">Saldo (€)</label>
                            <input class="input" type="number" step="0.01" id="saldo" placeholder="0.00" readonly>
                        </div>

                        <!-- ACCIONES -->
                        <div class="form-actions">
                            <button class="btn btn-primary" type="submit">Registrar Movimiento</button>
                            <a class="btn btn-secondary" href="registros.html">Ver Registros</a>
                            <button class="btn btn-secondary" type="button" id="btnLimpiar">Limpiar</button>
                            
                            <!-- Botones de Gestión alineados a la derecha -->
                            <a class="btn btn-secondary btn-gest-cuotas" href="activasocio.html">Gest.Socios</a>
                            <a class="btn btn-secondary btn-gest-socios" href="cuotas.html">Gest.Cuotas</a>
                        </div>

                        <div style="grid-column: 1 / -1;">
                            <p id="mensajeMovimiento"></p>
                        </div>

                    </form>
                </article>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="../pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/administracion.js"></script>

</body>

</html>
