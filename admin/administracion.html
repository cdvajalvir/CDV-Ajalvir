<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestión de Movimientos · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Disposición principal en 2 columnas estilo Dashboard */
        .admin-dashboard-grid {
            display: grid;
            grid-template-columns: 260px 1fr; /* Columna estrecha para botones (260px) y ancha para el formulario */
            gap: 1.5rem;
            align-items: start;
        }

        /* Tarjeta del menú de navegación lateral (columna izquierda) */
        .sidebar-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sidebar-card h4 {
            margin: 0 0 0.5rem 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.6);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-nav .btn {
            width: 100%;
            text-align: left;
            justify-content: flex-start;
            padding: 0.75rem 1rem;
        }

        /* Cuadrícula de 3 columnas para los campos del formulario dentro del área ancha */
        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            align-items: start;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        /* Indicador visual de campo solo lectura */
        input[readonly] {
            background-color: var(--color-bg-disabled, #f0f0f0);
            cursor: not-allowed;
        }

        /* Visibilidad y contraste de campos de solo lectura */
        #fecha_apunte[readonly],
        #saldo[readonly] {
            color: #ffffff !important;
            opacity: 1 !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
            cursor: default;
        }

        /* Ocultar flechas numéricas */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Responsividad en tablet y móvil */
        @media (max-width: 992px) {
            .admin-dashboard-grid {
                grid-template-columns: 1fr; /* Pasa a 1 columna apilada en móviles/tablets */
            }

            .sidebar-nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .sidebar-nav .btn {
                flex: 1;
                text-align: center;
                justify-content: center;
                min-width: 140px;
            }
        }

        @media (max-width: 768px) {
            .form-grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .form-grid-3 {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .form-actions .btn,
            .form-actions a.btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="../index.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links></div>
        </nav>
    </header>

    <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">

        <section class="page-hero">
            <p class="eyebrow">Administración</p>
            <h1>Gestión de Movimientos</h1>
            <p class="lead">Alta y registro de apuntes contables para el <strong>club</strong>.</p>
        </section>

        <!-- LAYOUT DE 2 COLUMNAS -->
        <div class="admin-dashboard-grid">

            <!-- COLUMNA IZQUIERDA: MENÚ DE NAVEGACIÓN DE GESTIÓN -->
            <aside class="sidebar-card">
                <h4>Menú Gestión</h4>
                <nav class="sidebar-nav">
                    <a class="btn btn-secondary" href="textoevento.html">
                        <i class="fa-solid fa-calendar-days" style="margin-right: 0.5rem;"></i> Prox.Evento
                    </a>
                    <a class="btn btn-secondary" href="activasocio.html">
                        <i class="fa-solid fa-users-gear" style="margin-right: 0.5rem;"></i> Gest.ActSocios
                    </a>
                    <a class="btn btn-secondary" href="cuotas.html">
                        <i class="fa-solid fa-file-invoice-dollar" style="margin-right: 0.5rem;"></i> Gest.Cuotas
                    </a>
                    <a class="btn btn-secondary" href="equipamiento.html">
                        <i class="fa-solid fa-shirt" style="margin-right: 0.5rem;"></i> Gest.Equipamiento
                    </a>
                </nav>
            </aside>

            <!-- COLUMNA DERECHA: REGISTRO DE MOVIMIENTOS -->
            <section class="content-area">
                <article class="card wide" style="margin: 0;">
                    <h3 style="margin-top: 0;">Nuevo Movimiento Contable</h3>

                    <form class="form form-grid-3" id="formMovimiento">

                        <!-- FILA 1 -->
                        <div class="form-group">
                            <label for="temporada">Temporada *</label>
                            <input class="input" id="temporada" required placeholder="2025/2026">
                        </div>

                        <div class="form-group">
                            <label for="fecha_contable">Fecha contable *</label>
                            <input class="input" type="date" id="fecha_contable" required>
                        </div>

                        <div class="form-group">
                            <label for="fecha_apunte">Fecha apunte</label>
                            <input class="input" type="text" id="fecha_apunte" placeholder="dd-mm-aaaa" readonly>
                        </div>

                        <!-- FILA 2 -->
                        <div class="form-group">
                            <label for="concepto">Concepto *</label>
                            <input class="input" id="concepto" required placeholder="Cobro de cuota">
                        </div>

                        <div class="form-group">
                            <label for="tipo">Tipo de gasto</label>
                            <select class="input" id="tipo">
                                <option value="">-- Seleccionar --</option>
                                <option value="Arbitraje">Arbitraje</option>
                                <option value="Otros">Otros</option>
                                <option value="Invitacion_visitante">Invitacion_visitante</option>
                                <option value="Invitacion_local">Invitacion_local</option>
                                <option value="Invitacion_conjunta">Invitacion_conjunta</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="codigo_cuenta">Código de cuenta (Socio) *</label>
                            <select class="input" id="codigo_cuenta" required>
                                <option value="">Cargando socios...</option>
                            </select>
                        </div>

                        <!-- FILA 3 -->
                        <div class="form-group">
                            <label for="importe">Importe (€) *</label>
                            <input class="input" type="number" step="0.01" id="importe" required placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label for="saldo">Saldo (€)</label>
                            <input class="input" type="number" step="0.01" id="saldo" placeholder="0.00" readonly>
                        </div>

                        <!-- ACCIONES DEL FORMULARIO -->
                        <div class="form-actions">
                            <button class="btn btn-primary" type="submit">Registrar Movimiento</button>
                            <a class="btn btn-secondary" href="registros.html">Ver Registros</a>
                            <button class="btn btn-secondary" type="button" id="btnLimpiar">Limpiar</button>
                        </div>

                        <div style="grid-column: 1 / -1;">
                            <p id="mensajeMovimiento"></p>
                        </div>

                    </form>
                </article>
            </section>

        </div>

    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D" target="_blank" class="social-link instagram" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/" target="_blank" class="social-link facebook" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com" class="social-link mail" aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="../pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/administracion.js"></script>

</body>

</html>
