<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestión de Equipamiento · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Layout principal estilo Dashboard de 2 columnas */
        .admin-dashboard-grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* Tarjeta del menú lateral de navegación */
        .sidebar-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sidebar-card h4 {
            margin: 0 0 0.5rem 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.6);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-nav .btn {
            width: 100%;
            text-align: left;
            justify-content: flex-start;
            padding: 0.75rem 1rem;
        }

        .sidebar-nav .btn.active {
            background-color: var(--color-accent, #e2b007);
            color: #000000;
            font-weight: 600;
        }

        /* Cuadrícula de formulario */
        .form-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            align-items: start;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        /* Selector multiselección con altura cómoda */
        select[multiple] {
            height: 160px;
            padding: 0.5rem;
            background-color: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
        }

        select[multiple] option {
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 2px;
        }

        select[multiple] option:checked {
            background-color: var(--color-accent, #e2b007) linear-gradient(0deg, var(--color-accent, #e2b007) 0%, var(--color-accent, #e2b007) 100%);
            color: #000000;
            font-weight: 600;
        }

        .help-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.2rem;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        /* Tabla de listado de artículos */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 1.5rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        .data-table th,
        .data-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table th {
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--color-accent, #e2b007);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .badge-socios {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin: 0.1rem;
        }
