<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestión de Socios · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Contenedor principal fluido */
        .container-fluid {
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        /* Selector de temporada compacto */
        .filter-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1rem;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 380px;
        }

        .filter-group label {
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .filter-select {
            width: 100%;
            padding: 0.3rem 0.5rem;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Grid de 5 columnas optimizado */
        .socios-grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            width: 100%;
        }

        /* Tarjeta ultra-compacta (reducida un 20% adicional en altura) */
        .socio-card-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 0.45rem 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .socio-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-grow: 1;
        }

        .socio-info h4 {
            margin: 0;
            font-size: 0.82rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .socio-info p {
            margin: 0;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.65);
        }

        .socio-action {
            flex-shrink: 0;
        }

        .btn-sm {
            padding: 0.15rem 0.45rem;
            font-size: 0.7rem;
            border-radius: 3px;
        }

        #mensajeActiva {
            margin-top: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* Adaptabilidad responsive (Breakpoints) */
        @media (max-width: 1500px) {
            .socios-grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1200px) {
            .socios-grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 850px) {
            .socios-grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .container-fluid {
                padding: 0 0.5rem;
            }
            .socios-grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="administracion.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links>
                <a href="administracion.html" class="nav-link">Administración</a>
            </div>
        </nav>
    </header>

    <main class="container-fluid" style="padding-top: 1rem; padding-bottom: 1.5rem;">

        <section class="page-hero" style="margin-bottom: 0.75rem;">
            <p class="eyebrow" style="margin-bottom: 0.1rem;">Administración</p>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.2rem;">Gestión de Socios por Temporada</h1>
            <p class="lead" style="font-size: 0.95rem; margin-bottom: 0;">Activación de socios pendientes para la temporada seleccionada.</p>
        </section>

        <section class="app-layout-single">
            <div class="content-grid">

                <!-- Selector de Temporada Independiente -->
                <div class="filter-wrapper">
                    <div class="filter-group">
                        <label for="selectTemporada">Temporada:</label>
                        <select class="filter-select" id="selectTemporada">
                            <option value="">Cargando temporadas...</option>

                </div>

                <!-- Grid de socios en 5 columnas (Ultra compacto) -->
                <div class="socios-grid-container" id="gridPendientes">
                    <div style="grid-column: span 5; text-align: center; padding: 2rem; color: #fff;">Selecciona una temporada...</div>

                <p id="mensajeActiva"></p>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="../pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
