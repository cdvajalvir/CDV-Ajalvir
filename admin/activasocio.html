<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestión de Socios · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        /* Contenedor principal ensanchado para aprovechar toda la pantalla */
        .container-fluid {
            width: 100%;
            max-width: 1750px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        /* Selector de temporada independiente y compacto */
        .filter-wrapper {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.85rem 1.25rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .filter-group label {
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .filter-select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        /* Grid fluido de 5 columnas */
        .socios-grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        /* Tarjeta individual de socio con altura reducida (~25%) */
        .socio-card-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            padding: 0.75rem 0.85rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .socio-info h4 {
            margin: 0 0 0.15rem 0;
            font-size: 0.9rem;
            color: #ffffff;
            word-break: break-word;
            line-height: 1.2;
        }

        .socio-info p {
            margin: 0;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .socio-action {
            display: flex;
            justify-content: flex-end;
        }

        .btn-sm {
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
        }

        #mensajeActiva {
            margin-top: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* Adaptabilidad responsive (Breakpoints para 5 columnas) */
        @media (max-width: 1500px) {
            .socios-grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1200px) {
            .socios-grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 850px) {
            .socios-grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .container-fluid {
                padding: 0 0.75rem;
            }
            .socios-grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="administracion.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links>
                <a href="administracion.html" class="nav-link">Administración</a>
            </div>
        </nav>
    </header>

    <main class="container-fluid" style="padding-top: 1.5rem; padding-bottom: 2rem;">

        <section class="page-hero" style="margin-bottom: 1.25rem;">
            <p class="eyebrow">Administración</p>
            <h1>Gestión de Socios por Temporada</h1>
            <p class="lead">Activación de socios pendientes para la temporada seleccionada.</p>
        </section>

        <section class="app-layout-single">
            <div class="content-grid">

                <!-- Selector de Temporada Independiente -->
                <div class="filter-wrapper">
                    <div class="filter-group">
                        <label for="selectTemporada">Temporada:</label>
                        <select class="filter-select" id="selectTemporada">
                            <option value="">Cargando temporadas...</option>
                        </select>
                    </div>
                </div>

                <!-- Grid de socios en 5 columnas -->
                <div class="socios-grid-container" id="gridPendientes">
                    <div style="grid-column: span 5; text-align: center; padding: 2rem; color: #fff;">Selecciona una temporada...</div>
                </div>

                <p id="mensajeActiva"></p>

            </div>
        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/activasocio.js"></script>

</body>

</html>
