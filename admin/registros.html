<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Consulta de Registros · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 1rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        .data-table th,
        .data-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--color-border, #e2e8f0);
            color: #ffffff;
        }

        .data-table thead th {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff !important;
            font-weight: 600;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .filter-row th {
            background-color: rgba(0, 0, 0, 0.2) !important;
            padding: 0.5rem 0.75rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .filter-select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .filter-select option {
            background-color: #1e293b;
            color: #ffffff;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--color-primary, #2563eb);
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="../index.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links>
                
            </div>
        </nav>
    </header>

    <main class="container">

        <section class="page-hero">
            <p class="eyebrow">Administración</p>
            <h1>Consulta de Registros</h1>
            <p class="lead">Histórico completo de movimientos contables registrados en el <strong>club</strong>.</p>
        </section>

        <section class="app-layout-single">
            <div class="content-grid">

                <article class="card wide">
                    <h3>Listado de Movimientos</h3>

                    <div class="table-responsive">
                        <table class="data-table" id="tablaMovimientos">
                            <thead>
                                <tr>
                                    <th>Temporada</th>
                                    <th>Fecha Contable</th>
                                    <th>Fecha Apunte</th>
                                    <th>Concepto</th>
                                    <th>Tipo</th>
                                    <th>CashSocio</th>
                                    <th>Importe (€)</th>
                                    <th>Saldo (€)</th>
                                </tr>
                                <!-- Fila de Selectores de Filtro -->
                                <tr class="filter-row">
                                    <th><select class="filter-select" data-column="0"><option value="">Todos</option></select></th>
                                    <th></th> <!-- Fecha Contable sin filtro -->
                                    <th><select class="filter-select" data-column="2"><option value="">Todos</option></select></th>
                                    <th></th> <!-- Concepto sin filtro -->
                                    <th><select class="filter-select" data-column="4"><option value="">Todos</option></select></th>
                                    <th><select class="filter-select" data-column="5"><option value="">Todos</option></select></th>
                                    <th></th> <!-- Importe sin filtro -->
                                    <th></th> <!-- Saldo sin filtro -->
                                </tr>
                            </thead>
                            <tbody id="tbodyMovimientos">
                                <tr>
                                    <td colspan="8" style="text-align: center; padding: 2rem;">Cargando registros...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </article>

            </div>
        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/registros.js"></script>

</body>

</html>
