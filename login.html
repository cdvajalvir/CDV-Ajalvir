<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso privado · CD Veteranos Ajalvir</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Estilos generales del body (los del paso anterior) */
        body.login-body {
            display: block;
            min-height: 100dvh;
            margin: 0;
            padding: 1.5rem 1rem 2rem 1rem;
            box-sizing: border-box;
            background-color: #f4f6f8;
        }

        .login-card {
            width: 100%;
            max-width: 380px; /* Ligeramente más estrecha y recogida */
            margin: 0 auto;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* 1. Reducir el tamaño del escudo a la mitad (ajusta los píxeles a tu gusto) */
        .login-logo {
            max-height: 65px; /* Altura máxima reducida */
            width: auto;
            margin-bottom: 0.5rem;
        }

        /* 2. Compactar títulos y textos */
        .login-card h1 {
            font-size: 1.3rem;
            margin: 0 0 0.2rem 0;
        }

        .login-card > p {
            font-size: 0.9rem;
            margin: 0 0 1rem 0;
            color: #666;
        }

        /* 3. Juntar los campos del formulario, etiquetas y botones */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.4rem; /* Reduce drásticamente la separación entre elementos del formulario */
            text-align: left;
        }

        .login-form label {
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .login-form input {
            padding: 0.5rem; /* Inputs un poco más compactos en altura */
            font-size: 0.95rem;
        }

        .login-form button {
            margin-top: 0.8rem;
            padding: 0.6rem;
        }

        /* Enlaces inferiores más compactos */
        .login-card p a {
            font-size: 0.85rem;
        }

        .site-footer {
            width: 100%;
        }
    </style>
</head>
<body class="login-body">

    <main class="login-card">
        <img class="login-logo" src="assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
        <h1>Acceso privado</h1>
        <p>CD Veteranos Ajalvir</p>

        <form id="loginForm" class="login-form">
            <label for="dni">DNI o NIE</label>
            <input type="text" id="dni" required placeholder="00000000X/X0000000X" autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Contraseña" autocomplete="current-password">

            <button type="submit">Entrar</button>
        </form>

        <p id="loginError" class="error"></p>
        <p><a href="index.html">Volver a la página principal</a></p>
        <p>¿Todavía no eres socio?&nbsp;&nbsp;<a href="registro.html">Solicitar alta</a></p>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
