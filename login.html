<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso privado · CD Veteranos Ajalvir</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Ajustes específicos para la página de login (compacta y limpia) */
        body.login-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem 1rem 5rem 1rem;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
            background: #fff;
            color: var(--text-dark);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-yellow);
        }

        .login-logo {
            max-height: 65px;
            width: auto;
            margin: 0 auto 0.5rem auto;
            display: block;
            object-fit: contain;
        }

        .login-card h1 {
            font-size: 1.3rem;
            margin: 0 0 0.2rem 0;
            color: var(--text-dark);
        }

        .login-card > p {
            font-size: 0.9rem;
            margin: 0 0 1rem 0;
            color: var(--muted-dark);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            text-align: left;
        }

        .login-form label {
            font-size: 0.85rem;
            margin-top: 0.3rem;
            color: var(--text-dark);
            font-weight: 900;
        }

        .login-form input {
            padding: 0.6rem 0.8rem;
            font-size: 0.95rem;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #fff;
            color: var(--text-dark);
            width: 100%;
        }

        .login-form button {
            margin-top: 0.8rem;
            padding: 0.7rem;
            width: 100%;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--yellow), #fff176);
            color: var(--blue-dark);
            border: none;
            font-weight: 900;
            cursor: pointer;
        }

        .login-links {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .login-card p a {
            font-size: 0.85rem;
            color: var(--blue);
            font-weight: 900;
            text-decoration: none;
        }
        
        .login-card p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-body">

    <main class="login-card">
        <img class="login-logo" src="assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
        <h1>Acceso privado</h1>
        <p>CD Veteranos Ajalvir</p>

        <form id="loginForm" class="login-form">
            <label for="dni">DNI o NIE</label>
            <input type="text" id="dni" required placeholder="00000000X/X0000000X" autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Contraseña" autocomplete="current-password">

            <button type="submit">Entrar</button>
        </form>

        <p id="loginError" class="error" style="margin-top: 0.5rem;"></p>
        
        <div class="login-links">
            <p><a href="index.html">Volver a la página principal</a></p>
            <p>¿Todavía no eres socio?&nbsp;&nbsp;<a href="registro.html">Solicitar alta</a></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p>© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
