<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso privado · CD Veteranos Ajalvir</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Forzamos que el body permita apilar la tarjeta centrada y el footer a ancho completo */
        body.login-body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            margin: 0;
        }
        .login-card {
            margin: auto; /* Centra la tarjeta en el espacio disponible */
        }
        .site-footer {
            width: 100%; /* Ocupa todo el ancho de la pantalla */
        }
    </style>
</head>
<body class="login-body">

    <div></div> <!-- Espaciador superior invisible para equilibrar el centrado -->

    <main class="login-card">
        <img class="login-logo" src="assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
        <h1>Acceso privado</h1>
        <p>CD Veteranos Ajalvir <span id="temporadaActualLabel" style="font-size: 0.85rem; opacity: 0.8;"></span></p>

        <form id="registroForm" class="login-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required placeholder="Nombre" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="apellido">Apellidos</label>
                    <input type="text" id="apellido" required placeholder="Apellidos" autocomplete="username">
                </div>
            </div>

            <label for="dni">DNI o NIE</label>
            <input type="text" id="dni" required placeholder="DNI o NIE" autocomplete="username">

            <label for="email">Email</label>
            <input type="text" id="email" required placeholder="Email" autocomplete="username">

            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" required placeholder="Teléfono" autocomplete="username">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Contraseña" autocomplete="current-password">

            <button type="submit">Solicitar alta</button>
        </form>

        <p id="registroMensaje" class="error"></p>
        <p><a href="index.html">Volver a la página principal</a></p>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/registro.js"></script>
</body>
</html>
