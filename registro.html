<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitar alta · CD Veteranos Ajalvir</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Ajustes específicos para la página de registro (compacta y adaptable) */
        body.login-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem 1rem 5rem 1rem;
            box-sizing: border-box;
            overscroll-behavior-y: none;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            text-align: center;
            background: #fff;
            color: var(--text-dark);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-yellow);
        }

        .login-logo {
            max-height: 55px;
            width: auto;
            margin: 0 auto 0.3rem auto;
            display: block;
            object-fit: contain;
        }

        .login-card h1 {
            font-size: 1.25rem;
            margin: 0 0 0.1rem 0;
            color: var(--text-dark);
        }

        .login-card > p {
            font-size: 0.85rem;
            margin: 0 0 0.8rem 0;
            color: var(--muted-dark);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.35rem; 
            text-align: left;
        }

        .form-row {
            display: flex;
            gap: 0.5rem;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .login-form label {
            font-size: 0.8rem;
            margin-top: 0.2rem;
            margin-bottom: 0.1rem;
            color: var(--text-dark);
            font-weight: 900;
        }

        .login-form input {
            padding: 0.45rem 0.6rem;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #fff;
            color: var(--text-dark);
        }

        .login-form button {
            margin-top: 0.6rem;
            padding: 0.55rem;
            width: 100%;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--yellow), #fff176);
            color: var(--blue-dark);
            border: none;
            font-weight: 900;
            cursor: pointer;
        }

        .login-card p {
            font-size: 0.85rem;
            margin-top: 0.6rem;
            margin-bottom: 0;
        }

        .login-card p a {
            color: var(--blue);
            font-weight: 900;
            text-decoration: none;
        }

        .login-card p a:hover {
            text-decoration: underline;
        }

        /* En pantallas muy estrechas, las filas dobles del registro pasan a una columna */
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0.35rem;
            }
        }
    </style>
</head>
<body class="login-body">

    <main class="login-card">
        <img class="login-logo" src="assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
        <h1>Solicitud de alta</h1>
        <p>CD Veteranos Ajalvir <span id="temporadaActualLabel" style="font-size: 0.85rem; opacity: 0.8;"></span></p>

        <form id="registroForm" class="login-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required placeholder="Nombre" autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label for="apellido">Apellidos</label>
                    <input type="text" id="apellido" required placeholder="Apellidos" autocomplete="family-name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dni">DNI o NIE</label>
                    <input type="text" id="dni" required placeholder="00000000X" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" required placeholder="600000000" autocomplete="tel">
                </div>
            </div>

            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com" autocomplete="email">

            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Contraseña" autocomplete="new-password">

            <button type="submit">Solicitar alta</button>
        </form>

        <p id="registroMensaje" class="error"></p>
        <p><a href="index.html">Volver a la página principal</a></p>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p>© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/registro.js"></script>
</body>
</html>
