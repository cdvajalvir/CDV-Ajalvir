name: Enviar Recordatorio Convocatoria

on:
  schedule:
    # Se ejecuta todos los días a las 15:00 UTC (puedes cambiar la hora)
    - cron: '0 15 * * *'
  # Permite también lanzarlo manualmente desde la pestaña "Actions" de GitHub por si quieres probarlo
  workflow_dispatch:

jobs:
    enviar-aviso:
      runs-on: ubuntu-latest
      steps:
        - name: Llamar a la Edge Function de Supabase
          run: |
            curl -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
                 -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
                 -H "Content-Type: application/json"
