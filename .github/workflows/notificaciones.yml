name: Enviar Recordatorio Convocatoria

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  enviar-aviso:
    runs-on: ubuntu-latest
    steps:
      - name: Depurar URL de Supabase
        run: |
          if [ -z "${{ secrets.SUPABASE_FUNCTION_URL }}" ]; then
            echo "¡ALERTA! El secreto SUPABASE_FUNCTION_URL está completamente vacío en GitHub."
            exit 1
          else
            echo "El secreto existe y mide: ${#{ secrets.SUPABASE_FUNCTION_URL }} caracteres."
          fi

      - name: Llamar a la Edge Function de Supabase
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Content-Type: application/json" \
               -d "{}"
