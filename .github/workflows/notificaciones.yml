- name: Llamar a la Edge Function de Supabase
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Esto imprimirá los primeros 10 caracteres de la URL para ver si empieza por https://
          echo "URL configurada empieza por: ${SUPABASE_FUNCTION_URL:0:10}"
          
          curl -v -X POST "$SUPABASE_FUNCTION_URL" \
               -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
               -H "Content-Type: application/json" \
               -d "{}"
