name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta 4 veces al día (cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Permite ejecutar manualmente la tarea desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar petición HTTP a Supabase
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
