<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convocatoria · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        .tabla-convocatorias {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .convocatoria-fila {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            display: grid;
            grid-template-columns: 2fr 130px 1fr 110px 2fr 90px 80px;
            gap: 0.75rem;
            align-items: center;
        }
        .convocatoria-fila header-fila {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.2rem;
            display: block;
        }
        .campo-grupo {
            display: flex;
            flex-direction: column;
        }
        .campo-grupo label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2px;
        }
        .convocatoria-fila input,
        .convocatoria-fila select,
        .convocatoria-fila textarea {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 0.9rem;
            width: 100%;
        }
        .convocatoria-fila input:focus,
        .convocatoria-fila select:focus,
        .convocatoria-fila textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-guardar {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            height: fit-content;
        }
        .btn-guardar:hover {
            background: #0369a1;
        }
        .btn-nuevo {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 0 auto 2rem auto;
        }
        .btn-nuevo:hover {
            background: #059669;
        }
        .toggle-activo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
        }
        .toggle-activo-container input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            cursor: pointer;
        }
        .toggle-activo-container span {
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Responsivo básico por si la pantalla es estrecha */
        @media(max-width: 1024px) {
            .convocatoria-fila {
                grid-template-columns: 1fr;
                gap: 0.5rem;
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="../index.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links></div>
        </nav>
    </header>

    <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">

        <section class="page-hero" style="text-align: center; margin-bottom: 2rem;">
            <p class="eyebrow">Área privada</p>
            <h1>Gestión de Convocatorias</h1>
            <p class="lead">Edita y activa las convocatorias en formato de línea rápida.</p>
        </section>

        <!-- Botón para añadir nueva convocatoria -->
        <button id="btnNuevaConvocatoria" class="btn-nuevo">+ Añadir Nueva Convocatoria</button>

        <!-- Contenedor principal de la lista en formato fila -->
        <div id="contenedorConvocatoria" class="tabla-convocatorias">
            <p style="text-align: center; padding: 2rem; color: #fff;">Cargando convocatorias...</p>
        </div>

    </main>

    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/gestconvocatoria.js"></script>

</body>

</html>
