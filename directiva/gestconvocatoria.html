<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convocatoria · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .tabla-convocatorias {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 1300px;
            margin: 0 auto;
        }
        /* Forzamos una única línea horizontal con grid de 7 columnas */
        .convocatoria-fila {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            display: grid;
            grid-template-columns: 2fr 130px 1.2fr 90px 2fr 80px 80px;
            gap: 0.75rem;
            align-items: center;
        }
        .campo-grupo {
            display: flex;
            flex-direction: column;
        }
        .campo-grupo label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .convocatoria-fila input,
        .convocatoria-fila select {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 0.85rem;
            width: 100%;
        }
        .convocatoria-fila input:focus,
        .convocatoria-fila select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-guardar {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 7px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
        }
        .btn-guardar:hover {
            background: #0369a1;
        }
        .btn-nuevo {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 0 auto 2rem auto;
        }
        .btn-nuevo:hover {
            background: #059669;
        }
        .toggle-activo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .toggle-activo-container input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            cursor: pointer;
        }
        .toggle-activo-container span {
            font-size: 0.65rem;
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="../index.html">
                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links></div>
        </nav>
    </header>

    <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">

        <section class="page-hero" style="text-align: center; margin-bottom: 2rem;">
            <p class="eyebrow">Área privada</p>
            <h1>Gestión de Convocatorias</h1>
            <p class="lead">Edita y activa las convocatorias en formato de línea rápida.</p>
        </section>

        <!-- Botón para añadir nueva convocatoria -->
        <button id="btnNuevaConvocatoria" class="btn-nuevo">+ Añadir Nueva Convocatoria</button>

        <!-- Contenedor principal de la lista en formato fila -->
        <div id="contenedorConvocatoria" class="tabla-convocatorias">
            <p style="text-align: center; padding: 2rem; color: #fff;">Cargando convocatorias...</p>
        </div>

    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"
                       aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
            </div>
            <div>
                <a href="../pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/gestconvocatoria.js"></script>

</body>

</html>
