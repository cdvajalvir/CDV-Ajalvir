<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Panel directiva · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

    <!-- ======================================================
         CABECERA
    ======================================================= -->

    <header class="site-header">

        <nav class="navbar container">

            <a class="brand" href="../index.html">

                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>

                <span>CD Veteranos Ajalvir</span>

            </a>

            <button class="nav-toggle" data-nav-toggle>
                ☰
            </button>

            <div class="nav-links" data-nav-links></div>

        </nav>

    </header>

    <!-- ======================================================
         CONTENIDO
    ======================================================= -->

    <main class="container">

        <!-- Cabecera -->

        <section class="page-hero">

            <p class="eyebrow">
                Área privada
            </p>

            <h1>
                Panel de directiva
            </h1>

            <p class="lead">
                Panel de trabajo para la gestión interna del club.
            </p>

        </section>

        <!-- Aplicación -->

        <section class="app-layout">

            <!-- Menú lateral -->

            <aside class="app-sidebar">

                <div class="app-sidebar-title">

                    <span class="brand-mark">
                        CDV
                    </span>

                    <span>
                        Menú
                    </span>

                </div>

                <nav class="app-menu">

                    <a class="active" href="directiva.html">
                        Resumen
                    </a>

                    <a href="socios.html">
                        Socios
                    </a>

                    <a href="registros.html">
                        Registros
                    </a>

                    <a href="equipos.html">
                        Equipos
                    </a>

                    <a href="cuotas.html">
                        Cuotas
                    </a>

                    <a href="noticias.html">
                        Noticias
                    </a>

                    <a href="documentos.html">
                        Documentos
                    </a>

                </nav>

            </aside>

            <!-- Panel principal -->

            <div class="app-main">

                <div class="content-grid">

                    <!-- Resumen de saldos de Directiva y Administradores -->
                    <article class="card">

                        <h3>
                            Resumen de saldos (Directiva y Administradores)
                        </h3>

                        <div class="table-responsive">
                            <table class="table" id="tablaSaldosDirectiva">
                                <thead>
                                    <tr>
                                        <th>Nombre y Apellidos</th>
                                        <th style="text-align: right;">Saldo</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="2" style="text-align: center;">Cargando saldos...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </article>

                </div>

            </div>

        </section>

    </main>

    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/directiva.js"></script>

</body>

</html>
