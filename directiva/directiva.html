<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Panel directiva · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

    <!-- ======================================================
         CABECERA
    ======================================================= -->

    <header class="site-header">

        <nav class="navbar container">

            <a class="brand" href="../index.html">

                <span class="brand-logo">
                    <img src="../assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>

                <span>CD Veteranos Ajalvir</span>

            </a>

            <button class="nav-toggle" data-nav-toggle>
                ☰
            </button>

            <div class="nav-links" data-nav-links></div>

        </nav>

    </header>

    <!-- ======================================================
         CONTENIDO
    ======================================================= -->

    <main class="container">

        <!-- Cabecera -->

        <section class="page-hero">

            <p class="eyebrow">
                Área privada
            </p>

            <h1>
                Panel de directiva
            </h1>

        </section>

        <!-- Aplicación -->

        <section class="app-layout">

            <!-- Menú lateral -->

            <aside class="app-sidebar">

                <div class="app-sidebar-title">
                    <!-- Selector de temporada dinámico -->
                    <select id="selectTemporada" style="width: 100%; padding: 6px; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 4px; font-weight: bold; cursor: pointer;">
                        <option value="">Cargando temporadas...</option>
                    </select>
                </div>

                <nav class="app-menu">

                    <a class="active" href="../admin/registros.html">
                        Registros
                    </a>

                    <a href="../admin/gestconvocatoria.html">
                        Convocatoria
                    </a>

                </nav>

            </aside>

            <!-- Panel principal -->

            <div class="app-main">

                <div class="content-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; width: 100%;">

                    <!-- ==========================================
                         FILA SUPERIOR
                    =========================================== -->
                    
                    <!-- Resumen de saldos (Ocupa columna 1) -->
                    <article class="card" style="margin: 0; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <h3>Resumen de saldos (Directiva y Administradores)</h3>
                            <div class="table-responsive">
                                <table class="table" id="tablaSaldosDirectiva">
                                    <thead>
                                        <tr>
                                            <th>Nombre y Apellidos</th>
                                            <th style="text-align: right;">Saldo</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="2" style="text-align: center;">Cargando saldos...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </article>

                    <!-- Estado de Cuotas (Ocupa columna 2) -->
                    <article class="card" style="margin: 0; display: flex; flex-direction: column; justify-content: space-between;">
                        <h3>Estado de Cuotas (Socios)</h3>
                        <div style="position: relative; height: 250px; width: 100%;">
                            <canvas id="graficoCuotas"></canvas>
                        </div>
                    </article>

                    <!-- Detalle de Gastos (Ocupa columna 3 - Borde derecho de referencia) -->
                    <article class="card" style="margin: 0; display: flex; flex-direction: column; justify-content: space-between;">
                        <h3>Detalle Gastos</h3>
                        <div style="position: relative; height: 250px; width: 100%;">
                            <canvas id="graficoDetalleGastos"></canvas>
                        </div>
                    </article>


                    <!-- ==========================================
                         FILA INFERIOR
                    =========================================== -->

                    <!-- Gráfico Evolución (Ocupa las columnas 1 y 2 / Equivalente al 66.6% o tu deseado ancho) -->
                    <article class="card" style="margin: 0; grid-column: span 2; min-width: 0;">
                        <h3>Evolución de Ingresos y Gastos por Mes</h3>
                        <div style="width: 100%; overflow-x: auto;">
                            <div id="contenedorGraficoBarras" style="position: relative; height: 300px; min-width: 500px;">
                                <canvas id="graficoIngresosGastos"></canvas>
                            </div>
                        </div>
                    </article>

                    <!-- Participación del Socio (Ocupa exactamente la columna 3, alineada con Detalle Gastos) -->
                    <article class="card" style="margin: 0; grid-column: span 1; height: 185px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                        <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem; color: #94a3b8;">Participación del Socio</h3>
                        <p id="participacionSocioValor" style="font-size: 2.5rem; font-weight: bold; color: #38bdf8; margin: 0;">
                            0.00 €
                        </p>
                        <small style="color: #64748b; margin-top: 0.5rem; font-size: 0.85rem;">
                            Temporada <span id="temporadaParticipacionLabel"></span>
                        </small>
                    </article>

                </div>

            </div>

        </section>

    </main>

    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script type="module" src="../assets/js/nav-auth.js"></script>
    <script type="module" src="../assets/js/directiva.js"></script>

</body>

</html>
