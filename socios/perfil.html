        <a class="brand" href="socios.html">

                    Información personal
                </h2>

                <div class="profile-actions">

                    <button
                        id="btnEditar"
                        class="btn btn-primary">

                        Editar perfil

                    </button>

                    <button
                        id="btnGuardar"
                        class="btn btn-primary"
                        hidden>

                        Guardar

                    </button>

                    <button
                        id="btnCancelar"
                        class="btn btn-secondary"
                        hidden>

                        Cancelar

                    </button>

                </div>

            </div>

                <!-- Se rellena automáticamente -->
            </div>
