<!doctype html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convocatoria · CD Veteranos Ajalvir</title>

    <!-- Ruta a la hoja de estilos subiendo un nivel a la raíz -->
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .convocatoria-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .convocatoria-detalle {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }
        .detalle-item span {
            display: block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
        }
        .detalle-item p {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
        }
        .comentarios-box {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid var(--accent-color, #007bff);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .estado-asistencia {
            margin-top: 1rem;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>

    <!-- ======================================================
         CABECERA
    ======================================================= -->
    <header class="site-header">

    </header>

        <!-- Cabecera de la página -->

            <p class="eyebrow">Área privada</p>
            <h1>Próxima Convocatoria</h1>
            <p class="lead">Consulta los detalles del próximo encuentro y confirma tu asistencia.</p>
        </section>

        <!-- Contenedor principal de la convocatoria -->
        <div id="contenedorConvocatoria">
            <p style="text-align: center; padding: 2rem; color: #fff;">Cargando convocatoria...</p>
        </div>

    </main>

    <footer class="site-footer">

                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D"
                       target="_blank"
                       class="social-link instagram"

                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/"
                       target="_blank"
                       class="social-link facebook"
                       aria-label="Facebook">

                    </a>
                    <a href="mailto:cdve.ajalvir@gmail.com"
                       class="social-link mail"
                       aria-label="Correo electrónico">

                    </a>
                </div>

            <div>
